# 파일을 config.properties로 복사한 뒤 값을 입력하세요. 환경 변수 값이 우선합니다.
# Windows 경로에는 역슬래시 대신 / 를 사용하세요.
PORT=8765
WORK_AGENT_DATA=work/data

# 개인 이름과 부르는 말을 각자 정하세요. 이름을 비우면 work-agent를 사용합니다.
# 부르는 말을 비우면 이름을 그대로 사용합니다.
AGENT_NAME=work-agent
AGENT_CALL_NAME=work-agent

# 이미 로그인한 CLI를 사용합니다. 기본값 codex, 대안 claude, 자연어 비활성화 off.
AGENT_ENGINE=codex
AGENT_EXECUTABLE=
AGENT_MODEL=
AGENT_TIMEOUT_SECONDS=180

# Slack 앱의 Socket Mode를 켜고 아래 세 값을 채우세요.
SLACK_APP_TOKEN=
SLACK_BOT_TOKEN=
SLACK_USER_ID=
# 만료되는 app-level 토큰(xoxe.xapp-)을 사용할 때만 입력합니다.
SLACK_REFRESH_TOKEN=
SLACK_CLIENT_ID=
SLACK_CLIENT_SECRET=
SLACK_APP_TOKEN_EXPIRES_AT=0

# 매일 한국 시간에 각 CLI로 짧은 요청을 보냅니다. 예: 06:00. 비우면 끕니다.
CLAUDE_SESSION_TIME=
CLAUDE_EXECUTABLE=
CODEX_SESSION_TIME=

# scope가 있는 Jira Cloud 토큰은 API gateway 주소를 씁니다. /rest/api는 붙이지 않습니다.
# Cloud: JIRA_EMAIL + API token / Data Center: 개인 액세스 토큰(Bearer).
JIRA_URL=
# 이슈 링크용 사이트 주소입니다. 비우면 동기화 시 Jira에서 조회합니다.
JIRA_SITE_URL=
JIRA_KIND=cloud
JIRA_EMAIL=
# 토큰 값이 아니라, 토큰을 읽을 환경변수 이름입니다.
JIRA_TOKEN_ENV=JIRA_API_TOKEN
JIRA_JQL=assignee = currentUser() AND (resolution = Unresolved OR updated >= -14d) ORDER BY updated DESC

# Bitbucket Cloud: 접근 가능한 저장소의 리뷰 요청과 내 PR 댓글을 한국 시간 08:00~16:30에 30분마다 확인합니다.
# 이메일을 비우면 JIRA_EMAIL을 사용합니다. 토큰은 사용자 환경변수에 저장하세요.
BITBUCKET_EMAIL=
BITBUCKET_TOKEN_ENV=BITBUCKET_API_TOKEN
BITBUCKET_AUTO_REVIEW=true
# 워크스페이스 자동 조회 권한이 없을 때만 쉼표로 지정합니다. 저장소 제한은 없습니다.
BITBUCKET_WORKSPACES=
REVIEW_TIMEOUT_SECONDS=600

# Google Calendar: 설정 → 대상 캘린더 → 캘린더 통합 → iCal 형식의 비공개 주소.
# 읽기 전용입니다. 아래 둘 중 하나만 설정하세요. 반복 일정과 예외 일정을 처리합니다.
# 비공개 주소는 배포 파일에 넣지 않고 로컬 config.properties에만 저장합니다.
CALENDAR_ICS_URL=
CALENDAR_ICS_FILE=

# 그룹웨어 설정 파일입니다. 비우면 아래 기본 위치를 사용합니다.
# %LOCALAPPDATA%/Suresoft/groupware/settings.json (주소, 회의실, 우선순위, 암호화 세션과 예약 기록 경로)
GROUPWARE_CONFIG=

# 비워 두면 기본 사용자 폴더의 .codex/sessions, .claude/projects를 읽습니다.
CODEX_LOG_ROOT=
CLAUDE_LOG_ROOT=
IMPORT_DAYS=14
# CLI 기록과 Jira·캘린더는 각각 5분 간격으로 정기 동기화합니다.
AUTO_SYNC=true

# 모두 한국 시간입니다. 빈 값이면 해당 알림을 끕니다. 프로그램 실행 중에만 동작합니다.
BRIEFING_TIME=09:00
# 공유 캘린더에서 본인의 휴가를 구분할 이름입니다. 예: 홍길동
# 이 이름과 휴가·연차·반차가 함께 있는 날은 데일리 자동 발송에서 제외합니다.
CALENDAR_OWNER_NAME=
FRIDAY_REVIEW_TIME=16:30

# 외부 작업 실행기가 로컬 API로 결과를 보낼 때만 별도의 긴 문자열을 설정하세요.
WORK_AGENT_TOKEN=
